services:
  db:
    image: postgres:16
    container_name: pitwall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports:
      - "5432:5432"
    volumes:
      - pitwall_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pitwall_pgdata:
